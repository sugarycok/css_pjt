
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NOTICE BOARD LIST</title>

    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div id="wrap">

        <div class="title">
            Notice board
        </div>

        <table class="list">
            <thead>
                <tr>
                    <th>No</th>
                    <th>제목</th>
                    <th>글쓴이</th>
                    <th>작성일</th>
                    <th>좋아요</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>10</td>
                    <td>네이버 지도(ver.5) 임베드</td>
                    <td>Hong Gildong</td>
                    <td>2021.12.15</td>
                    <td>2</td>
                </tr>
                <tr>
                    <td>10</td>
                    <td>네이버 지도(ver.5) 임베드</td>
                    <td>Hong Gildong</td>
                    <td>2021.12.15</td>
                    <td>2</td>
                </tr>
            </tbody>
        </table>

        <div class="fun">
            <a href="#write">글쓰기</a>
        </div>

        <!-- 게시글 작성 영역 -->
        <form id="write">
            <table class="write">
                <tbody>
                    <tr>
                        <th>제목</th>
                        <td>
                            <input type="text" name="subject">
                        </td>
                    </tr>

                    <tr>
                        <th>내용</th>
                        <td>
                            <textarea name="content"></textarea>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="btn">
                <button type="submit">글쓰기</button>
                <button type="reset">취소</button>
            </div>
        </form>

    </div>

</body>
</html>
